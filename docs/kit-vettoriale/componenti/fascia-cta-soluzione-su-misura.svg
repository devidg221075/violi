<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1350" height="136" viewBox="0 0 1350 136" role="img"><title>fascia-cta-soluzione-su-misura</title><desc>Ricostruzione vettoriale dalla tavola master; non estrazione dei tracciati originali.</desc><defs><linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087A40"/><stop offset=".5" stop-color="#045327"/><stop offset="1" stop-color="#013D1F"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#E1B84F"/><stop offset=".4" stop-color="#C29536"/><stop offset="1" stop-color="#AC7B1E"/></linearGradient><linearGradient id="ivory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F6F1"/></linearGradient><linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E2EBE1"/><stop offset="1" stop-color="#C6D8C9"/></linearGradient><linearGradient id="sand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF7F1"/><stop offset="1" stop-color="#EBDDCA"/></linearGradient></defs><rect x="1" y="1" width="1348" height="133" rx="12" fill="url(#ivory)" stroke="#ECEBE6" stroke-width="1"/><path d="M64 1H80L23 134H7Z" fill="url(#gold)"/><path d="M103 1H210L153 134H46Z" fill="url(#sage)"/><text x="242" y="50" font-family="Montserrat,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#045327">Hai bisogno di una</text><text x="242" y="81" font-family="Montserrat,Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start" fill="#045327">soluzione su misura?</text><path d="M590 25L590 108" stroke="#C29536" stroke-width="1.3"/><text x="620" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1F2937">Il nostro team è a tua disposizione</text><text x="620" y="68" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1F2937">per analizzare le tue esigenze e</text><text x="620" y="90" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#1F2937">proporti la soluzione più adatta.</text><g transform="translate(1080 43)"><rect x="1" y="1" width="248" height="46" rx="9" fill="url(#green)" stroke="#045327" stroke-width="1.3"/><g transform="translate(15 13.5) scale(0.328125)" color="#FFFFFF"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5H39L51 17V59H15Z M39 5V18H51 M23 29H43 M23 38H43 M23 47H36"/></g></g><text x="125.5" y="28.855670103092784" font-family="Montserrat,Arial,sans-serif" font-size="13.487972508591065" font-weight="600" text-anchor="middle" fill="#FFFFFF">Richiedi un preventivo</text><g transform="translate(214 14.0) scale(0.3125)" color="#FFFFFF"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 32H55 M43 20L55 32L43 44"/></g></g></g></svg>